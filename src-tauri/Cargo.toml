[package]
name = "rss-desktop-widget"
version = "0.2.6"
description = "A transparent RSS desktop widget for Windows and macOS"
authors = ["RSS Desktop"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rss_desktop_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2.3"
html2text = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "native-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3"
