name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Test frontend and Rust
        shell: pwsh
        run: |
          npm run build
          npm run check:rust
          npm run test:rust

      - name: Build Tauri bundles
        run: npm run tauri:build

      - name: Collect release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assetDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          Copy-Item "src-tauri/target/release/rss-desktop-widget.exe" "$assetDir/RSS-Desktop-$version-x64.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/RSS Desktop Widget_${version}_x64-setup.exe" "$assetDir/RSS-Desktop-$version-x64-setup.exe"
          Copy-Item "src-tauri/target/release/bundle/msi/RSS Desktop Widget_${version}_x64_en-US.msi" "$assetDir/RSS-Desktop-$version-x64.msi"

          Compress-Archive `
            -Path "$assetDir/RSS-Desktop-$version-x64.exe", "README.md" `
            -DestinationPath "$assetDir/RSS-Desktop-$version-portable-x64.zip" `
            -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.zip
